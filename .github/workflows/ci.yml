name: VoltFix Continuous Integration

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Lint, Build & Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: voltfix_db
          MYSQL_USER: voltfix_user
          MYSQL_PASSWORD: voltfix_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate
        env:
          DATABASE_URL: "mysql://voltfix_user:voltfix_password@127.0.0.1:3306/voltfix_db"

      - name: Type Check Backend
        working-directory: ./backend
        run: npx tsc --noEmit

      - name: Run Jest Test Suite & Coverage
        working-directory: ./backend
        run: npm run test:coverage
        env:
          DATABASE_URL: "mysql://voltfix_user:voltfix_password@127.0.0.1:3306/voltfix_db"
          JWT_ACCESS_SECRET: "test_access_secret_key_32_characters_minimum"
          JWT_REFRESH_SECRET: "test_refresh_secret_key_32_characters_minimum"

  frontend-build:
    name: Frontend Lint & Production Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      - name: Build Frontend Application
        working-directory: ./frontend
        run: npm run build
